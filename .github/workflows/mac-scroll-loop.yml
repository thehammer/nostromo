# Manual only. Loops a Mac test class to prove it is deterministic, on the same runner type as the Mac
# job: once plain, once with a CPU spinner per core (a loaded hosted runner). Run it with
#   gh workflow run mac-scroll-loop.yml --ref <branch> [-f iterations=50] [-f tests=NostromoTests/MotherDetailScrollTests] [-f modes='["plain"]']
# and read the "Summary" step (iterations started, failed test cases, layout conflicts). See docs/ci.md.
# One iteration of the scroll class takes about 2.5 minutes, so 50 take about 2 hours: the job timeout
# must be longer than that (the first 50-iteration run was cancelled by the old 110 minute limit while
# iteration 50 was still running normally). xcodebuild needs more than one iteration for -test-iterations.
name: mac-scroll-loop

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations of the test class
        default: "50"
      tests:
        description: -only-testing target
        default: NostromoTests/MotherDetailScrollTests
      modes:
        description: 'JSON list of runner modes: ["plain","loaded"], or just ["plain"]'
        default: '["plain","loaded"]'

permissions:
  contents: read

jobs:
  loop:
    name: loop (${{ matrix.mode }})
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: CPU load (loaded mode only)
        if: matrix.mode == 'loaded'
        run: |
          n=$(sysctl -n hw.ncpu); echo "spinners: $n"
          for i in $(seq "$n"); do nohup yes > /dev/null 2>&1 & done
          sleep 1; uptime
      - name: Loop the test class
        env:
          TESTS: ${{ inputs.tests }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -o pipefail; mkdir -p macOS/build; cd macOS
          xcodebuild -project Nostromo.xcodeproj -scheme NostromoTests \
            -destination 'platform=macOS' -derivedDataPath build \
            -only-testing:"$TESTS" -test-iterations "$ITERATIONS" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 test \
            2>&1 | tee build/loop.log | grep --line-buffered -E "error:|Executed [0-9]+ tests|Test Case .* failed|\*\* TEST"
      - name: Summary
        if: always()
        run: |
          cd macOS/build
          echo "iterations started: $(grep -c "Test Suite 'MotherDetailScrollTests' started" loop.log)"
          echo "failed test cases:  $(grep -c "Test Case .* failed" loop.log)"
          echo "layout conflicts:   $(grep -c "Unable to simultaneously satisfy" loop.log)"
          grep "Test Case .* failed" loop.log | sort | uniq -c || true
          grep -E "Executed [0-9]+ tests" loop.log | tail -3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-log-${{ matrix.mode }}
          path: macOS/build/loop.log
