name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  python-tooling:
    name: Python tooling tests
    # macOS, not ubuntu. The suite includes `ShellScriptSyntaxTests` (needs bash
    # and shellcheck), `ShellScriptCpuGuardDeadPidTests` (exercises the driver's
    # `ps -o time=` guard, whose output format differs between BSD and GNU ps)
    # and source-scanning policy tests over the Swift tree. On ubuntu those would
    # either fail for environmental reasons or — worse — *skip*, and a skipped
    # test is a vacuously passing test, which is the exact bug class this suite
    # exists to catch.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      # Every dependency the suite needs is installed above, so a skip here means
      # the suite quietly stopped checking something. If a skip ever becomes
      # legitimate, add it to an explicit allowlist in this step rather than
      # relaxing the check.
      #
      # The pattern matches how unittest *reports* a skip — the per-test
      # `... skipped 'reason'` suffix and the `(skipped=N)` summary count — and
      # deliberately not the bare word. Five tests in the doctor suite are named
      # things like `test_blank_lines_are_skipped` because skipping a malformed
      # log line is the behaviour under test, so `grep -i skipped` matches them
      # and fails the job every single run. A guard that cannot pass is as
      # useless as a criterion that cannot fail, which is the defect this whole
      # PR is about; grepping for the report, not the word, is the fix.
      - name: Python tooling tests
        run: |
          set -o pipefail
          make python-test 2>&1 | tee /tmp/pytests.txt
          if grep -nE '\.\.\. skipped|\(skipped=' /tmp/pytests.txt; then
            echo "::error::a test was skipped — see the note in .github/workflows/ci.yml"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Swift tests. Before these jobs existed, nothing on GitHub ran a single Swift
  # test: `make mac-test` and `make kit-test` were local-only, so a PR could go
  # green while breaking the Mac app or NostromoKit.
  #
  # Shared decisions (kept here once rather than repeated per job):
  #   * No path filters. A path-filtered job that is skipped reports as
  #     "skipped", which a required check treats as passing — the exact silent
  #     gap these jobs exist to close.
  #   * `macos-26` + an explicitly selected Xcode, same pins as
  #     macos-launch-smoke.yml, so a runner-image rollover shows up as a diff
  #     here rather than as an unexplained red.
  #   * Concurrency is per job and ref, cancelling superseded *pull request*
  #     runs only. Runs on `main` are never cancelled, so every merge commit
  #     gets a verdict.
  #   * No dependency or DerivedData cache. The project has no remote SwiftPM
  #     dependencies (NostromoKit is a local package), so there is nothing to
  #     cache safely, and restoring stale DerivedData could make a stale build
  #     product pass a test the current source would fail.
  # ---------------------------------------------------------------------------
  swift-tests-mac:
    name: Swift tests (Mac app)
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: swift-tests-mac-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Log toolchain, OS and display state
        run: |
          xcodebuild -version
          sw_vers
          system_profiler SPDisplaysDataType

      # The same command a developer runs locally (the `NostromoTests` scheme).
      - name: make mac-test
        run: make mac-test

      # The Makefile filters xcodebuild's output down to a few lines, so the
      # .xcresult bundle is where the per-test failure detail lives.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-tests-mac-xcresult
          path: macOS/build/Logs/Test
          if-no-files-found: warn
          retention-days: 14

  swift-tests-kit:
    name: Swift tests (NostromoKit)
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: swift-tests-kit-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Log toolchain and OS versions
        run: |
          swift --version
          sw_vers

      # The same command a developer runs locally.
      - name: make kit-test
        run: |
          set -o pipefail
          make kit-test 2>&1 | tee "$RUNNER_TEMP/kit-test.log"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-tests-kit-log
          path: ${{ runner.temp }}/kit-test.log
          if-no-files-found: warn
          retention-days: 14

  ios-simulator-build:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-simulator-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Log toolchain and OS versions
        run: |
          xcodebuild -version
          sw_vers

      # Compile check only: no device, no signing, no tests. Catches iOS
      # compile breaks (the iOS app is not part of `make mac-test`).
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          cd iOS
          xcodebuild -project Nostromo.xcodeproj -scheme Nostromo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log" | grep -E "error:|warning:|\*\* BUILD"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: warn
          retention-days: 14
