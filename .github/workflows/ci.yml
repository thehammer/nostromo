name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/exp-gate-base]
  # Manual run on any pushed branch, with an optional job selector. Used by
  # `make ci-remote` (scripts/ci_remote.py) so a job can run CI before it has a
  # PR. GitHub only offers this trigger once it exists on the default branch.
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Which jobs to run. all = every job; rust = Build & Lint (and its three parts); python = Python
          tooling tests; swift = Mac app + NostromoKit + iOS simulator build; mac =
          Swift tests (Mac app); kit = Swift tests (NostromoKit); ios = iOS simulator
          build.
        type: choice
        options: [all, rust, python, swift, mac, kit, ios]
        default: all

# Least privilege: every job here only checks out code, builds, tests and uploads artifacts.
# A dispatch needs nothing more here: the *caller's* token needs `actions: write`,
# which `gh`'s `repo` and `workflow` scopes include.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The runner's disk is the limit: `cargo build --all-targets` + clippy + test over ~90 test
  # binaries with full debuginfo ran it out of space ("No space left on device"). Line tables
  # keep backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  # Decides whether the Swift jobs below can be skipped. They are skipped only
  # on a pull request whose every changed path is provably irrelevant to Swift
  # (see scripts/ci_changes.py: default-run, short allow-list). Push and
  # dispatch events always run them. The job always succeeds, so it never
  # blocks a merge by itself; if the classification fails for any reason the
  # output is `true` and the Swift jobs run.
  changes:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Detect changed paths (dispatch)' || 'Detect changed paths' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.classify.outputs.swift }}

    steps:
      # The pull_request checkout is the merge commit of the PR head into the
      # base, so its first parent is the base tip and `HEAD^1..HEAD` is exactly
      # what the PR changes. Depth 2 fetches both parents.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          swift=true
          if [ "$EVENT_NAME" = pull_request ] && git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            # --no-renames lists both sides of a rename; -z keeps odd filenames unquoted.
            if out=$(git diff -z --no-renames --name-only 'HEAD^1' HEAD | python3 scripts/ci_changes.py) \
               && [ "$out" = "swift=false" ]; then
              swift=false
            fi
          fi
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "Swift jobs needed: $swift"
          git diff --no-renames --name-only 'HEAD^1' HEAD 2>/dev/null | head -50 || true

  # ---------------------------------------------------------------------------
  # Rust. Three independent jobs run in parallel and `Build & Lint` (the
  # required status check) is the aggregate of them: it succeeds only if all
  # three did.
  #
  # No cargo cache, on purpose. The old job cached `target` plus the registry
  # under a key with a restore-keys fallback: the cache was ~7.6 GB, restoring
  # it took 250-295 s and saving it 40-135 s, while compiling every dependency
  # from scratch takes ~45 s (the workspace crate, which no cache can help, is
  # the other ~165 s) and downloading the crates ~2 s. See docs/ci.md for the
  # measurements. CARGO_INCREMENTAL=0 because a cold build has nothing to be
  # incremental against.
  #
  # `cargo build --all-targets` is gone: `clippy --all-targets` type-checks
  # every target (lib, bins, tests; the repo has no examples or benches) and
  # `cargo test` compiles and links the lib, the bins and every test binary.
  # ---------------------------------------------------------------------------
  rust-fmt:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","rust"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'Rust format (dispatch)' || 'Rust format' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  rust-clippy:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","rust"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'Rust clippy (dispatch)' || 'Rust clippy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","rust"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'Rust tests (dispatch)' || 'Rust tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

  # The required status check. Its name is the same as before the split, so
  # branch protection needs no change. `always()` makes it run (and fail) when a
  # part failed or was cancelled instead of being skipped, and a skipped
  # required check counts as passing: do not weaken the `success` test below.
  build:
    if: always() && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","rust"]'), inputs.only))
    name: ${{ github.event_name == 'workflow_dispatch' && 'Build & Lint (dispatch)' || 'Build & Lint' }}
    needs: [rust-fmt, rust-clippy, rust-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every Rust part must have succeeded
        env:
          FMT: ${{ needs.rust-fmt.result }}
          CLIPPY: ${{ needs.rust-clippy.result }}
          TEST: ${{ needs.rust-test.result }}
        run: |
          echo "rust-fmt=$FMT rust-clippy=$CLIPPY rust-test=$TEST"
          [ "$FMT" = success ] && [ "$CLIPPY" = success ] && [ "$TEST" = success ]

  python-tooling:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","python"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'Python tooling tests (dispatch)' || 'Python tooling tests' }}
    # macOS, not ubuntu. The suite includes `ShellScriptSyntaxTests` (needs bash
    # and shellcheck), `ShellScriptCpuGuardDeadPidTests` (exercises the driver's
    # `ps -o time=` guard, whose output format differs between BSD and GNU ps)
    # and source-scanning policy tests over the Swift tree. On ubuntu those would
    # either fail for environmental reasons or — worse — *skip*, and a skipped
    # test is a vacuously passing test, which is the exact bug class this suite
    # exists to catch.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      # Every dependency the suite needs is installed above, so a skip here means
      # the suite quietly stopped checking something. If a skip ever becomes
      # legitimate, add it to an explicit allowlist in this step rather than
      # relaxing the check.
      #
      # The pattern matches how unittest *reports* a skip — the per-test
      # `... skipped 'reason'` suffix and the `(skipped=N)` summary count — and
      # deliberately not the bare word. Five tests in the doctor suite are named
      # things like `test_blank_lines_are_skipped` because skipping a malformed
      # log line is the behaviour under test, so `grep -i skipped` matches them
      # and fails the job every single run. A guard that cannot pass is as
      # useless as a criterion that cannot fail, which is the defect this whole
      # PR is about; grepping for the report, not the word, is the fix.
      - name: Python tooling tests
        run: |
          set -o pipefail
          make python-test 2>&1 | tee /tmp/pytests.txt
          # The explicit allowlist the note above asks for. These tests compare the vendored
          # Mother contract with a live Mother checkout, which the runner does not have (the
          # comparison runs locally and as an advisory gate: see the docstring in tests/mother_contract/test_contract_fixtures.py).
          # They skip by design on CI; the vendored-copy-versus-manifest tests still run.
          allow='^test_vendored_copy_matches_mothers_origin_main \(test_contract_fixtures\.UpstreamDriftTests\.test_vendored_copy_matches_mothers_origin_main\) \.\.\. skipped|^test_mothers_contract_check_script_accepts_every_vendored_fixture \(test_contract_fixtures\.MothersOwnCheckerTests\.test_mothers_contract_check_script_accepts_every_vendored_fixture\) \.\.\. skipped|^test_every_broker_message_conforms_to_mothers_contract_check \(test_fake_mother_broker\.ContractTest\.test_every_broker_message_conforms_to_mothers_contract_check\) \.\.\. skipped'
          reported=$(grep -E '\.\.\. skipped' /tmp/pytests.txt || true)
          unexpected=$(printf '%s\n' "$reported" | grep -v '^$' | grep -vE "$allow" || true)
          n_allowed=$(printf '%s\n' "$reported" | grep -cE "$allow" || true)
          n_summary=$( (grep -oE '\(skipped=[0-9]+\)' /tmp/pytests.txt || true) | (grep -oE '[0-9]+' || true) | awk '{s+=$1} END {print s+0}')
          if [ -n "$unexpected" ] || [ "$n_summary" -ne "$n_allowed" ]; then
            echo "$unexpected"
            echo "::error::a test was skipped that is not on the allowlist (allowed skips reported: $n_allowed, summary count: $n_summary) — see the note in .github/workflows/ci.yml"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Swift tests. Before these jobs existed, nothing on GitHub ran a single Swift
  # test: `make mac-test` and `make kit-test` were local-only, so a PR could go
  # green while breaking the Mac app or NostromoKit.
  #
  # Shared decisions (kept here once rather than repeated per job):
  #   * No workflow-level `paths:` filter. A workflow whose `paths:` filter does
  #     not match never starts, so a required check from it stays "Expected"
  #     forever. The Swift jobs are gated by the `changes` job instead, and the
  #     gate is on each STEP (`needs.changes.outputs.swift == 'true'`), not on
  #     the job. A job skipped by a job-level `if:` posts its check under the
  #     raw, unevaluated `name:` expression (measured: PR #370), so a required
  #     `Swift tests (Mac app)` would stay "Expected" and block the PR. With
  #     step-level gating the job still starts, reports success under its real
  #     name in seconds and does none of the work. The gate skips only on a pull
  #     request whose EVERY changed path is on the short allow-list in
  #     scripts/ci_changes.py; anything unknown, an empty diff or a classifier
  #     failure runs the jobs. Pushes to `main` and dispatches always run them.
  #     `Build & Lint` and `Python tooling tests` are never gated.
  #   * `macos-26` + an explicitly selected Xcode, same pins as
  #     macos-launch-smoke.yml, so a runner-image rollover shows up as a diff
  #     here rather than as an unexplained red.
  #   * Concurrency is per job, event and ref, cancelling superseded *pull
  #     request* runs only. Runs on `main` are never cancelled, so every merge
  #     commit gets a verdict. The event name is in the group because GitHub
  #     keeps at most one *pending* run per group and drops the older pending
  #     one even with cancel-in-progress false: without it, a dispatch on
  #     `main` would share a group with `main` pushes and could displace a
  #     pending push run. A dispatch on a feature branch (`refs/heads/x`) never
  #     shares a group with that branch's PR runs (`refs/pull/N/merge`). Two
  #     dispatches on one branch queue; a third replaces the pending second.
  #   * `workflow_dispatch` (see `only` above): every job's `if:` maps the
  #     selector to jobs, and push / PR events always run every job. Each job's
  #     `name:` is unchanged for push and PR but gets a ` (dispatch)` suffix on
  #     a dispatch. A skipped job still posts a check run under its name on the
  #     head SHA, and a skipped required check counts as passing; so without
  #     the suffix a dispatch with `only=swift` on a PR's head commit would post
  #     a skipped `Build & Lint` and silently satisfy the required check. The
  #     suffixed names never match a required check.
  #   * `push` stays `main`-only: pushing a feature branch triggers nothing until
  #     a PR is opened or someone dispatches.
  #   * The only cache is the SwiftPM *source checkouts* of the Mac job
  #     (`macOS/build/SourcePackages`: SwiftTerm and swift-argument-parser),
  #     keyed on the hash of Package.resolved plus the Xcode version, with NO
  #     restore-keys. It holds fetched source at pinned revisions and nothing
  #     compiled: every run still compiles every package and every app source
  #     from scratch, so a cache hit cannot make a stale build pass. There is
  #     deliberately no DerivedData cache: restoring stale DerivedData could
  #     make a stale build product pass a test the current source would fail,
  #     which is how #345 got through.
  # ---------------------------------------------------------------------------
  swift-tests-mac:
    needs: changes
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","swift","mac"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'Swift tests (Mac app) (dispatch)' || 'Swift tests (Mac app)' }}
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: swift-tests-mac-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: needs.changes.outputs.swift == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Log toolchain, OS and display state
        if: needs.changes.outputs.swift == 'true'
        run: |
          xcodebuild -version
          sw_vers
          system_profiler SPDisplaysDataType

      # The app's mono font is Fira Code Nerd Font (Theme.firaCode), which a
      # developer has installed in ~/Library/Fonts but a hosted runner does not.
      # Without it AppKit falls back to SF Mono, whose line metrics differ, and
      # the rendered-height goldens in ChatTurnViewLayoutTests (recorded against
      # Fira Code) come out 3-120 pt short. Install the exact release the
      # goldens were recorded with, pinned by version and checksum, so the
      # font can neither drift under the tests nor be swapped by a bad download.
      - name: Install Fira Code Nerd Font (pinned)
        if: needs.changes.outputs.swift == 'true'
        env:
          FIRA_VERSION: v3.4.0
          FIRA_SHA256: 7cc4ffd8f7a1fc914cdab7b149808298165ff7a7f40e40d82dea9ebe41e8ca0b
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/FiraCode.zip" \
            "https://github.com/ryanoasis/nerd-fonts/releases/download/${FIRA_VERSION}/FiraCode.zip"
          echo "${FIRA_SHA256}  $RUNNER_TEMP/FiraCode.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/Library/Fonts"
          unzip -q -o "$RUNNER_TEMP/FiraCode.zip" 'FiraCodeNerdFont-*.ttf' -d "$HOME/Library/Fonts"
          ls "$HOME/Library/Fonts"

      - name: Xcode version (cache key)
        if: needs.changes.outputs.swift == 'true'
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -c 'A-Za-z0-9.\n' '-' | tr '\n' '_')" >> "$GITHUB_OUTPUT"

      # Source checkouts only; see the shared-decisions note above.
      - name: Cache SwiftPM packages (resolved sources only)
        if: needs.changes.outputs.swift == 'true'
        uses: actions/cache@v4
        with:
          path: macOS/build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('macOS/Nostromo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Its own step so the fetch is timed (and a cache hit is visible). Pinned
      # to Package.resolved: no re-resolution, so a cache can never serve a
      # version the repo does not pin.
      - name: Resolve SwiftPM packages
        if: needs.changes.outputs.swift == 'true'
        run: |
          xcodebuild -resolvePackageDependencies -project macOS/Nostromo.xcodeproj \
            -scheme NostromoTests -derivedDataPath macOS/build \
            -onlyUsePackageVersionsFromResolvedFile

      # Same suite as `make mac-test` (the `NostromoTests` scheme), run as one
      # build, a parallel phase and a serial phase for the layout-golden
      # classes. See macOS/scripts/mac-test-ci.sh for the split and why.
      - name: Mac tests (parallel + serial layout goldens)
        if: needs.changes.outputs.swift == 'true'
        run: macOS/scripts/mac-test-ci.sh

      # Compile gate for the app target. `make mac-test` builds only the
      # NostromoTests bundle, which does not include app-only sources such as
      # TerminalPaneHostView (they link SwiftTerm), so a non-compiling app could
      # pass it (PR #345). Same DerivedData as the test step above, so SwiftTerm
      # and the shared sources are already built. Debug only: it compiles the
      # same sources as Release. This is the real "the app builds" gate;
      # "Launch smoke (advisory)" green does not imply it.
      - name: Build Mac app (compile gate)
        if: needs.changes.outputs.swift == 'true'
        run: |
          set -o pipefail
          xcodebuild -project macOS/Nostromo.xcodeproj -scheme Nostromo \
            -configuration Debug -derivedDataPath macOS/build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee "$RUNNER_TEMP/mac-app-build.log" | grep -E "error:|\*\* BUILD"
          if grep -q "error:" "$RUNNER_TEMP/mac-app-build.log"; then exit 1; fi

      - name: Upload app build log
        if: needs.changes.outputs.swift == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-build-log
          path: ${{ runner.temp }}/mac-app-build.log
          if-no-files-found: warn
          retention-days: 14

      # The test script prints a filtered view; the full phase logs and the
      # .xcresult bundles are where the per-test failure detail lives.
      - name: Upload test results
        if: needs.changes.outputs.swift == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-tests-mac-xcresult
          path: |
            macOS/build/Logs/Test
            ${{ runner.temp }}/mac-build.log
            ${{ runner.temp }}/mac-parallel.log
            ${{ runner.temp }}/mac-serial.log
          if-no-files-found: warn
          retention-days: 14

  swift-tests-kit:
    needs: changes
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","swift","kit"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'Swift tests (NostromoKit) (dispatch)' || 'Swift tests (NostromoKit)' }}
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: swift-tests-kit-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: needs.changes.outputs.swift == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Log toolchain and OS versions
        if: needs.changes.outputs.swift == 'true'
        run: |
          swift --version
          sw_vers

      # The same command a developer runs locally.
      - name: make kit-test
        if: needs.changes.outputs.swift == 'true'
        run: |
          set -o pipefail
          make kit-test 2>&1 | tee "$RUNNER_TEMP/kit-test.log"

      - name: Upload test log
        if: needs.changes.outputs.swift == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-tests-kit-log
          path: ${{ runner.temp }}/kit-test.log
          if-no-files-found: warn
          retention-days: 14

  ios-simulator-build:
    needs: changes
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","swift","ios"]'), inputs.only)
    name: ${{ github.event_name == 'workflow_dispatch' && 'iOS simulator build (dispatch)' || 'iOS simulator build' }}
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ios-simulator-build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: needs.changes.outputs.swift == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Log toolchain and OS versions
        if: needs.changes.outputs.swift == 'true'
        run: |
          xcodebuild -version
          sw_vers

      # Compile check only: no device, no signing, no tests. Catches iOS
      # compile breaks (the iOS app is not part of `make mac-test`).
      - name: Build for iOS Simulator
        if: needs.changes.outputs.swift == 'true'
        run: |
          set -o pipefail
          cd iOS
          xcodebuild -project Nostromo.xcodeproj -scheme Nostromo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log" | grep -E "error:|warning:|\*\* BUILD"

      - name: Upload build log
        if: needs.changes.outputs.swift == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: warn
          retention-days: 14
