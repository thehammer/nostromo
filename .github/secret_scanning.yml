# Test fixtures for the PHI/secret detector (src/sensitive_text.rs). They contain fake
# credentials on purpose (AWS documentation example keys, placeholder URLs with passwords)
# so the detector's tests can prove it flags them. They are not real secrets.
# The terminal-text fixtures do the same for the follow redactor (src/terminal/redact.rs).
paths-ignore:
  - "tests/sensitive_text_corpus.rs"
  - "tests/sensitive_text_hardening.rs"
  - "tests/terminal_text_engine.rs"
  - "tests/terminal_text_redaction.rs"
  - "tests/terminal_text_delivery.rs"
  - "tests/terminal_text_memory.rs"
  - "tests/fixtures/terminal_text/**"
