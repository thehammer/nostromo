AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Nostromo push relay (W13): a stateless Lambda between the Nostromo primary and
  Apple's push service. Deploy it into a DEDICATED personal AWS account (or a
  member account of your personal AWS Organization), never a Carefeed account.
  See README.md.

Parameters:
  FunctionName:
    Type: String
    Default: nostromo-push-relay
    Description: Also names the log group, /aws/lambda/<FunctionName>.
  BudgetAlertEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+$"
    Description: >
      Where the monthly cost alarm writes. The function URL is public (AuthType
      NONE), so a flood of bad requests is a cost; this is the tripwire.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly cost (USD) the alarm watches. Expected spend is cents.

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256

Resources:
  # ── the function and its URL ───────────────────────────────────────────────
  # Auth NONE: the daemon's bearer token is checked in code (a constant-time
  # compare against the daemon-token secret), because a function URL with IAM
  # auth would need the primary to sign requests with AWS credentials.
  PushRelayFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Ref FunctionName
      # The URL is public: this caps how much of the account's concurrency, and how
      # fast the bill, a flood of requests can use.
      ReservedConcurrentExecutions: 5
      CodeUri: .
      Handler: bootstrap
      Environment:
        Variables:
          TABLE_NAME: !Ref DeliveryTable
          DAEMON_TOKEN_SECRET: !Ref DaemonTokenSecret
          APNS_SECRET: !Ref ApnsSecret
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource: !GetAtt DeliveryTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: [!Ref DaemonTokenSecret, !Ref ApnsSecret]

  # ── the delivery record: {push_id, ts, kind, outcome, expires_at} ──────────
  # One item per attempt and a rate counter. TTL on `expires_at` deletes them
  # after seven days (lazily; the handler also filters by age on read). No
  # title, body, host, reference or repository is ever stored.
  DeliveryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ── the two secrets ────────────────────────────────────────────────────────
  # The daemon token is generated; read it once to put in
  # ~/.nostromo/push-relay-token on the primary. The APNs secret is a placeholder
  # that the README has you replace with the real key (`put-secret-value`); a
  # later deploy leaves a changed value alone because this property does not change.
  DaemonTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Bearer token the Nostromo primary presents to the push relay
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  ApnsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: APNs auth key (.p8), key id, team id and app bundle id
      SecretString: '{"key_pem":"REPLACE","key_id":"REPLACE","team_id":"REPLACE","topic":"REPLACE"}'

  # ── a cost tripwire ────────────────────────────────────────────────────────
  # The function URL has AuthType NONE (the bearer is checked in code), so anyone
  # can send it requests and each one is billed. Email when the month's actual
  # spend passes 80% of the budget, and when it is forecast to pass 100%.
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${FunctionName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail }

  # ── logs ───────────────────────────────────────────────────────────────────
  # Seven days, to match the delivery record. The handler logs only the kind, a
  # 6-hex prefix of the anonymous device reference and the APNs status.
  PushRelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 7

Outputs:
  FunctionUrl:
    Description: Put this in [push] relay_url on the primary
    Value: !GetAtt PushRelayFunctionUrl.FunctionUrl
  DaemonTokenSecretArn:
    Value: !Ref DaemonTokenSecret
  ApnsSecretArn:
    Value: !Ref ApnsSecret
