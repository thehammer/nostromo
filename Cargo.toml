[package]
name = "nostromo"
version = "0.1.0"
edition = "2021"
description = "nostromd: the Nostromo daemon, MCP bridge and hooks behind the Nostromo macOS/iOS apps"
authors = ["thehammer"]
license = "MIT"

[lib]
name = "nostromo"
path = "src/lib.rs"

[[bin]]
name = "nostromd"
path = "src/bin/nostromd.rs"

[[bin]]
name = "nostromo-mcp-bridge"
path = "src/bin/nostromo_mcp_bridge.rs"

[[bin]]
name = "nostromo-activity-hook"
path = "src/bin/nostromo_activity_hook.rs"

[[bin]]
name = "nostromo-google-auth"
path = "src/bin/nostromo_google_auth.rs"

[[bin]]
name = "nostromo-guard"
path = "src/bin/nostromo_guard.rs"

[[bin]]
name = "sensitive-text-scan"
path = "src/bin/sensitive_text_scan.rs"

[features]
# Test-only seams (e.g. pointing the Jira source at a local mock server). The
# crate enables it for its own tests through the self dev-dependency below;
# production builds never see it.
test-support = []

[dependencies]
# Embedded PTY: unused until terminal-pane 1a's TerminalManager; keep
portable-pty = "0.8"
vt100 = "0.16"

# Markdown parsing (transcript pane phase 2)
pulldown-cmark = { version = "0.12", default-features = false }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "io-util", "net", "fs"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"

# mDNS / Bonjour service discovery
mdns-sd = "0.11"
hostname = "0.4"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Utilities
directories = "5"
dirs-next = "2"
chrono = { version = "0.4", features = ["serde"] }
notify = "6"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# Reads the enclosing .app's Info.plist to identify a socket peer (peer_verify).
plist = "1"
regex = "1"

# SQLite (Teri todos)
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP + OAuth2 (Phase 4 native clients)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
oauth2 = "4"
tokio-util = { version = "0.7", features = ["io"] }

# GitHub API (Phase 4)
octocrab = "0.41"

# github-relay WebSocket subscriber
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
serde_yaml = "0.9"
url = "2"
# Huey news feeds (Atom/RSS)
feed-rs = "2"
unicode-normalization = "0.1.25"
# Private scratch dir for the model catalogue probe.
tempfile = "3"

# Verifies the code behind a socket peer by audit token (peer_verify). Both
# were already in the lock graph (via native-tls); macOS only, so the Linux
# build never links the Security framework.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[dev-dependencies]
nostromo = { path = ".", features = ["test-support"] }
wiremock = "0.6"
# Enables tokio::time::{pause, advance} for deterministic staleness-tick tests
# (pane_source_liveness / pane_sources staleness tests). Unified with the main
# `tokio` dependency's feature set at build time (single-crate, not a workspace).
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
