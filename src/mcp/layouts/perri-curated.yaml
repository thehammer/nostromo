name: perri-curated
description: >-
  Perri's curated review workspace (W5 — curated-agent-views). The review queue
  as the first tab of the `detail` region, above the REPL. The PR's
  conversation, its diff, files and tickets open as further tabs in that same
  region, created by the placement engine on the first `nostromo.show` that
  needs one. The queue is always there: it is pinned, and cannot be closed.
  Contrast `perri-standard`, which declares a fixed `diff` pane up front —
  that layout is the fallback for an agent still driving the raw pane tools,
  and stays byte-identical to what it has always been.
tree:
  direction: vertical
  ratios: [0.6, 0.4]
  children:
    - region: detail
      active: queue
      tabs:
        - { pane: queue, label: Queue }
    - pane: repl
panes:
  queue:
    source: perri.list_pr_queue
    content_kind: pr_list
